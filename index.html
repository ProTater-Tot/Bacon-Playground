<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bacon Playground</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Falling Bacon Background Elements -->
    <div class="bacon-rain">
        <div class="drop-strip" style="left: 5%; animation-delay: 0s; animation-duration: 6s;"></div>
        <div class="drop-strip" style="left: 15%; animation-delay: 2s; animation-duration: 8s;"></div>
        <div class="drop-strip" style="left: 25%; animation-delay: 4s; animation-duration: 7s;"></div>
        <div class="drop-strip" style="left: 40%; animation-delay: 1s; animation-duration: 9s;"></div>
        <div class="drop-strip" style="left: 55%; animation-delay: 5s; animation-duration: 6s;"></div>
        <div class="drop-strip" style="left: 65%; animation-delay: 3s; animation-duration: 8s;"></div>
        <div class="drop-strip" style="left: 75%; animation-delay: 0.5s; animation-duration: 7s;"></div>
        <div class="drop-strip" style="left: 85%; animation-delay: 2.5s; animation-duration: 9s;"></div>
        <div class="drop-strip" style="left: 95%; animation-delay: 1.5s; animation-duration: 6s;"></div>
    </div>

    <header>
        <div class="logo-container">
            <!-- Enhanced Stand-out Logo -->
            <div class="frying-pan-logo">
                <div class="pan-handle"></div>
                <div class="pan-body">
                    <div class="logo-bacon"></div>
                    <div class="logo-bacon delay"></div>
                </div>
            </div>
            <h1>Bacon Playground</h1>
        </div>
        <button id="back-btn" class="hidden">Back to Games</button>
    </header>

    <main>
        <div id="games-grid" class="games-grid"></div>

        <div id="game-player" class="game-player hidden">
            <div class="game-player-header">
                <h2 id="game-title">Game Title</h2>
                <button id="fullscreen-btn" class="hidden">Go Fullscreen</button>
            </div>
            <div class="iframe-container">
                <iframe id="game-frame" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
